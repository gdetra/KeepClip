name: Windows CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  formatting:
    name: Formatting
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore KeepClip.slnx --locked-mode
      - name: Compile WinUI and run its analyzer
        run: dotnet build src/KeepClip.App/KeepClip.App.csproj -c Release -p:Platform=x64 --no-restore
      - name: Check C# formatting and braces
        run: ./scripts/Format-Code.ps1 -Check
      - name: Check XAML and XML formatting
        run: ./scripts/Format-Markup.ps1 -Check
      - name: Verify code style regressions
        run: ./scripts/Test-CodeStyle.ps1

  test:
    name: Tests (${{ matrix.architecture }})
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install .NET SDK and matching test runtime
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          architecture: ${{ matrix.architecture }}
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore application tests with locked dependencies
        run: dotnet restore tests/KeepClip.Tests --locked-mode
      - name: Run application and native ABI tests
        run: dotnet test tests/KeepClip.Tests -c Release --arch ${{ matrix.architecture }} --no-restore --logger trx --results-directory TestResults/application
      - name: Restore Windows tests with locked dependencies
        run: dotnet restore tests/KeepClip.Windows.Tests --locked-mode
      - name: Run Windows tests
        run: dotnet test tests/KeepClip.Windows.Tests -c Release --arch ${{ matrix.architecture }} --no-restore --logger trx --results-directory TestResults/windows
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.architecture }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  validation:
    name: Release and packaging script checks
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
      - name: Restore pinned GitVersion tool
        run: dotnet tool restore
      - name: Verify version metadata and Store version rules
        run: |
          ./scripts/Test-Versioning.ps1
          ./scripts/Test-StoreVersion.ps1
      - name: Verify GitVersion history and release guards
        run: |
          ./scripts/Test-GitVersion.ps1
          ./scripts/Test-Release.ps1
      - name: Verify portable integrity checks
        run: |
          foreach ($architecture in @('x64', 'arm64', 'x86')) {
            ./scripts/Test-PortablePackage.ps1 -FixturesDirectory ./artifacts/package-tests -Architecture $architecture
          }